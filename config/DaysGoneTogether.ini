[Coop]
; UDP port this game listens on. Allow it through the LAN firewall; do not expose it to the Internet.
Port=27777
; Host: leave PeerHost empty and the first player who connects becomes your partner.
; Join: set PeerHost to the host's LAN IP address or hostname.
; Only one partner endpoint is accepted per game session. Restart to change partners/ports.
PeerHost=
PeerPort=27777
; Shown in the partner's log (max 15 characters).
PlayerName=Deacon
; Hotkey (decimal Windows virtual-key code) that teleports you next to your partner. 118 = F7.
TeleportKey=118
; F8 opens settings; F9 joins/leaves the partner's bike.
; Gamepad: View/Back + Y opens settings; View/Back + X joins/leaves.
; Colors: 0 Original, 1 Crimson, 2 Ocean, 3 Forest, 4 Sand, 5 Charcoal, 6 Violet.
JacketColor=0
TrousersColor=0
CapColor=0
ShowCap=1
SyncMotorcycles=1
; On the client: show the host's nearby enemies (streamed poses). On the host: stream them.
SyncEnemies=1
AllowPassenger=1
; Friendly fire is never loaded from disk: both players must enable it in the menu each session.
; Writes pawn/component details and the loaded animation list (DaysGoneTogether-anims.txt) on each new pawn.
Discovery=0
; Read-only runtime trace of mission/save-related UFunction signatures (names and parameter layouts only).
; No parameter values are logged; use only for reverse-engineering and disable after collecting a log.
MissionDiscovery=0
; EXPERIMENTAL: 1 redirects every save write to DaysGoneTogether-guest-saves (wiped at each start), so
; your real saves are never modified - and nothing from this session is kept. Not for normal play.
GuestSaveGuard=0
; Opt-in native test tools and API report; disabled for normal play.
; See docs/DEVELOPMENT.md. Never enable for normal play.
DebugTools=0
; Animation sequences played on the partner's avatar by speed. Use a short object name or the
; "Package.Object" path from DaysGoneTogether-anims.txt.
AnimIdle=dcn_idle_normal
AnimWalk=dcn_walk
AnimRun=/Game/Animation/Deacon/run/run.Run
AnimSprint=/Game/Animation/Deacon/run/sprint.Sprint
; Player and bike pose updates per second (10-30). Lower values save bandwidth.
PoseRate=20
; 1 also streams the face rig (about 280 more bones and much more bandwidth).
PoseFace=0
; EXPERIMENTAL, NOT YET TESTED IN THE GAME: "steam" uses a friends-only Steam lobby and Steam
; networking instead of LAN UDP (Port/PeerHost are then ignored). Both players must use the same
; mode. Host/invite/join from the F8 menu. Default "udp".
Transport=udp
; Steam mode only: 1 makes the mod also pump Steam callbacks. Try this only if overlay invites
; never arrive; the menu's "Join a Steam friend" row works without it.
SteamPumpCallbacks=0
