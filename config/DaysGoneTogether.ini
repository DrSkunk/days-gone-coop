[Coop]
; UDP port this game listens on. Allow it through the LAN firewall; do not expose it to the Internet.
Port=27777
; Only used for automatic LAN sessions (Transport=udp).
; Host: leave PeerHost empty. Join: set it to the host's LAN IP address or hostname.
PeerHost=
PeerPort=27777
; Empty uses your Steam persona name (or Deacon if Steam is unavailable).
; Optional LAN display-name override; state packets hold up to 15 UTF-8 bytes.
PlayerName=
; Hotkey (decimal Windows virtual-key code) that teleports you next to your partner. 118 = F7.
TeleportKey=118
; F8 opens settings; F9 joins/leaves the partner's bike.
; Gamepad: View/Back + Y opens settings; View/Back + X joins/leaves.
; Colors: 0 Original, 1 Crimson, 2 Ocean, 3 Forest, 4 Sand, 5 Charcoal, 6 Violet.
JacketColor=0
TrousersColor=0
CapColor=0
ShowCap=1
SyncMotorcycles=1
; On the client: show the host's nearby enemies (streamed poses). On the host: stream them.
SyncEnemies=1
AllowPassenger=1
; Friendly fire is never loaded from disk: both players must enable it in the menu each session.
; Writes pawn/component details and the loaded animation list (DaysGoneTogether-anims.txt) on each new pawn.
Discovery=0
; Read-only runtime trace of mission/save-related UFunction signatures (names and parameter layouts only).
; No parameter values are logged; use only for reverse-engineering and disable after collecting a log.
MissionDiscovery=0
; Read-only native UI investigation: F6 dumps loaded menu classes and widget references to
; DaysGoneTogether-menus.txt, including at the main/pause menu. Also enables UI event tracing.
MenuDiscovery=0
; EXPERIMENTAL, guest only: 1 redirects every save write to DaysGoneTogether-guest-saves (wiped at each
; start), so your real saves are never modified - and nothing from this session is kept. When the host
; has ShareSave=1, the host's saves are downloaded into that sandbox; then press Continue to play them.
GuestSaveGuard=0
; EXPERIMENTAL, host only: 1 sends a copy of your newest SaveGames folder to a GuestSaveGuard=1 partner
; when they ask for it. Quicksave first: the partner gets your last save, not your live game.
ShareSave=0
; Opt-in native test tools and API report; disabled for normal play.
; See docs/DEVELOPMENT.md. Never enable for normal play.
DebugTools=0
; Animation sequences played on the partner's avatar by speed. Use a short object name or the
; "Package.Object" path from DaysGoneTogether-anims.txt.
AnimIdle=dcn_idle_normal
AnimWalk=dcn_walk
AnimRun=/Game/Animation/Deacon/run/run.Run
AnimSprint=/Game/Animation/Deacon/run/sprint.Sprint
; Player and bike pose updates per second (10-30). Lower values save bandwidth.
PoseRate=20
; 1 also streams the face rig (about 280 more bones and much more bandwidth).
PoseFace=0
; Default "menu": choose Steam or LAN from CO-OP in the native title/pause menu.
; "udp": automatically host/join LAN using PeerHost/PeerPort at startup.
Transport=menu
; Steam lobby visibility: private (invite only), friends, public. Change while hosting in CO-OP.
Visibility=friends
; 1 makes the mod also pump Steam callbacks. Try this only if overlay invites
; never arrive; the menu's "Join a Steam friend" row works without it.
SteamPumpCallbacks=0
