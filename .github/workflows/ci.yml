name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install Python dependencies
        run: poetry install --no-interaction
      - name: Run tests
        run: make test CXX=g++

  build:
    name: Build ASI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix zip
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: imgui-${{ hashFiles('dependencies/imgui.version', 'dependencies/imgui.sha256') }}
      - name: Build and package
        env:
          CXX: x86_64-w64-mingw32-g++-posix
        run: |
          version="$(tr -d '[:space:]' < version.txt)-dev+${GITHUB_SHA::7}"
          COOP_VERSION="$version" make dist VERSION="$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TheysGone-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
